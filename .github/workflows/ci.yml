name: AI Ecosystem CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-agent-definitions:
    name: Lint Agent Definitions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      - name: Install AJV CLI
        run: npm install -g ajv-cli

      - name: Validate Agent Definitions with AJV
        run: |
          SCHEMA_FILE_ROOT="agent-definition.schema.json"
          SCHEMA_FILE_SCHEMAS_DIR=".schemas/agent-definition.schema.json"
          ACTUAL_SCHEMA_FILE=""

          if [ -f "$SCHEMA_FILE_ROOT" ]; then
            ACTUAL_SCHEMA_FILE="$SCHEMA_FILE_ROOT"
            echo "Using schema file from root: $ACTUAL_SCHEMA_FILE"
          elif [ -f "$SCHEMA_FILE_SCHEMAS_DIR" ]; then
            ACTUAL_SCHEMA_FILE="$SCHEMA_FILE_SCHEMAS_DIR"
            echo "Using schema file from .schemas directory: $ACTUAL_SCHEMA_FILE"
          else
            echo "Schema file agent-definition.schema.json not found at root or in .schemas/!"
            exit 1
          fi
          
          # Find files in either directory, command will not fail if one path doesn't exist.
          AGENT_FILES=$(find .jules/agents/ agents/ -type f \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null || true)
          
          if [ -z "$AGENT_FILES" ]; then
            echo "No agent definition files found in /.jules/agents/ or /agents/ to validate."
            # Exit successfully if no files are found, change to exit 1 if files are mandatory for the build to pass.
            exit 0
          fi
          
          echo "Found agent files to validate:"
          echo "$AGENT_FILES"
          
          # Prepare files for AJV: replace newlines with spaces for a single command line argument
          # This is safer than relying on shell expansion of $AGENT_FILES directly if filenames had spaces (unlikely here)
          AGENT_FILES_STR=$(echo "$AGENT_FILES" | tr '\n' ' ')

          # Validate all found agent files against the schema
          # --strict=true for stricter validation if supported by your AJV version and schema
          ajv validate -s "$ACTUAL_SCHEMA_FILE" -d "$AGENT_FILES_STR" --errors=text --strict=true


  test-python-libraries:
    name: Test Python Libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9'] # Start with one, can expand to e.g., [3.9, '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          PYTHON_LIBRARIES_PATH="libraries/python"
          if [ -f "$PYTHON_LIBRARIES_PATH/requirements.txt" ]; then
            pip install -r "$PYTHON_LIBRARIES_PATH/requirements.txt"
          else
            echo "No requirements.txt found at $PYTHON_LIBRARIES_PATH/requirements.txt. Skipping pip install of specific requirements."
          fi
          # Ensure linters and test runners are installed even if no project requirements.txt
          echo "Installing Flake8 and Pytest..."
          pip install flake8 pytest 

      - name: Lint with Flake8
        run: |
          PYTHON_LIBRARIES_PATH="libraries/python"
          # Check if the directory exists and contains any .py files
          if [ -d "$PYTHON_LIBRARIES_PATH" ] && [ -n "$(find $PYTHON_LIBRARIES_PATH -maxdepth 1 -name '*.py' -print -quit)" ]; then
            echo "Linting Python files in $PYTHON_LIBRARIES_PATH..."
            flake8 "$PYTHON_LIBRARIES_PATH/"
          else
            echo "Directory $PYTHON_LIBRARIES_PATH not found or contains no .py files directly under it. Skipping Flake8."
          fi

      - name: Run Pytests
        run: |
          PYTHON_LIBRARIES_PATH="libraries/python"
          PYTHON_TESTS_PATH="$PYTHON_LIBRARIES_PATH/tests" # Standard place for tests
          # Check if the tests directory exists and has test_*.py files
          if [ -d "$PYTHON_TESTS_PATH" ] && [ -n "$(find $PYTHON_TESTS_PATH -maxdepth 1 -name 'test_*.py' -print -quit)" ]; then
            echo "Running tests in $PYTHON_TESTS_PATH..."
            pytest "$PYTHON_TESTS_PATH/"
          else
            echo "Test directory $PYTHON_TESTS_PATH not found or contains no test_*.py files. Skipping Pytest."
            # Depending on requirements, you might want to exit 1 if tests are expected but not found.
          fi

  build-vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x' # Specify a major version, e.g., 18.x

      - name: Build ai-ecosystem-core extension
        # This assumes the extension is in extensions/ai-ecosystem-core
        # Add similar blocks for other extensions if they exist
        working-directory: ./extensions/ai-ecosystem-core
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found in $(pwd). Skipping build for this extension."
            # Depending on requirements, you might want to exit 1 if package.json is expected.
            exit 0 
          fi
          echo "Installing dependencies for ai-ecosystem-core..."
          npm ci
          echo "Compiling TypeScript for ai-ecosystem-core..."
          # Check if compile script exists, otherwise run tsc directly
          if npm run-script | grep -q 'compile'; then
            npm run compile
          else
            echo "No 'compile' script found in package.json, attempting direct tsc execution..."
            # Ensure typescript is available, either from devDependencies or globally (less ideal)
            if ! npx tsc -p .; then
              echo "Failed to compile with tsc. Ensure TypeScript is installed and a tsconfig.json exists."
              exit 1
            fi
          fi
          echo "Packaging ai-ecosystem-core extension..."
          # Install vsce locally if not already a devDependency to avoid global install issues
          # and ensure it's available for npx
          if ! npm list --depth=0 | grep -q '@vscode/vsce'; then
            echo "Installing @vscode/vsce locally..."
            npm install --save-dev @vscode/vsce 
          fi
          npx vsce package
      
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: vscode-extension-vsix-${{ github.run_id }}-${{ github.sha }} # Unique name for artifact
          # Path to the generated .vsix file. Glob pattern can be used if name is dynamic.
          # Assumes vsce package outputs the vsix in the current working directory (extensions/ai-ecosystem-core)
          path: ./extensions/ai-ecosystem-core/*.vsix 
          if-no-files-found: error # Error if the vsix file is not found
```
