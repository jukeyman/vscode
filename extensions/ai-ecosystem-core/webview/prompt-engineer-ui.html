<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   style-src ${webview.cspSource} 'unsafe-inline';
                   img-src ${webview.cspSource} https:;
                   script-src 'nonce-${nonce}';">
    <title>Prompt Engineering UI</title>
    <style>
        body {
            font-family: var(--vscode-font-family, sans-serif);
            padding: 15px;
            color: var(--vscode-editor-foreground);
            background-color: var(--vscode-editor-background);
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, textarea, button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box; /* So padding doesn't add to width */
            border: 1px solid var(--vscode-input-border, #ccc);
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 3px;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }
        pre#responseArea {
            background-color: var(--vscode-textBlockQuote-background, #f0f0f0);
            border: 1px solid var(--vscode-textBlockQuote-border, #ddd);
            padding: 10px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-radius: 3px;
            font-family: var(--vscode-editor-font-family, monospace); /* Use editor font for monospace */
        }
    </style>
</head>
<body>
    <h1>Prompt Engineering UI</h1>

    <div>
        <label for="promptSelector">Select Prompt:</label>
        <select id="promptSelector">
            <option value="mockPrompt1">Summarize Text (Mock)</option>
            <option value="mockPrompt2">Generate Code Comment (Mock)</option>
            <option value="explainConcept">Explain Concept (Mock)</option>
            <option value="translateText">Translate Text (Mock)</option>
        </select>
    </div>

    <div>
        <label for="promptContext">Context/Variables (JSON):</label>
        <textarea id="promptContext" rows="5" placeholder='Example: {"textToSummarize": "Long text here..."}'></textarea>
    </div>

    <div>
        <button id="sendPromptButton">Send Prompt</button>
    </div>

    <h2>LLM Response:</h2>
    <pre id="responseArea">Awaiting prompt...</pre>

    <script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
